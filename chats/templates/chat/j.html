<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }
    
    .chat-container {
        width: 50%;
        margin: 20px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .chat-box {
        max-height: 400px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fafafa;
    }
    
    .message {
        display: flex;
        align-items: flex-end;
        margin: 10px 0;
    }
    
    .sent {
        justify-content: flex-end;
        text-align: right;
    }
    
    .received {
        justify-content: flex-start;
        text-align: left;
    }
    
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0 10px;
    }
    
    .message-content {
        max-width: 60%;
        padding: 10px;
        border-radius: 10px;
    }
    
    .sent .message-content {
        background: #d1e7dd;
        color: black;
    }
    
    .received .message-content {
        background: #f8d7da;
        color: black;
    }
    
    .username {
        font-weight: bold;
        font-size: 12px;
    }
    
    .text {
        font-size: 14px;
    }
    
    .timestamp {
        font-size: 10px;
        color: gray;
        margin-top: 5px;
    }
    
    .chat-form {
        display: flex;
        margin-top: 10px;
    }
    
    .message-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-right: 10px;
    }
    
    .send-btn {
        padding: 10px 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .send-btn:hover {
        background: #0056b3;
    }
    
</style>
<body>
    <div class="chat-container">
        <h2>Chat with {{ receiver.username }}</h2>
    
        <div class="chat-box">
        </div>
    
        <form method="post" class="chat-form">
            {% csrf_token %}
            <input type="text" class="message-input" placeholder="Type a message..." name="" required id="">
            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>
    <script>
        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/messaging/'
            + "{{receiver.id}}"
            + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data)
            const messageBox = document.querySelector('.chat-box');
            if (data['type'] == "chat.history") {
                data.messages.forEach((elem) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add("message")
                    const messageDivContent = document.createElement('div');
                    messageDivContent.classList.add('.message-content')
                    

                    if(elem['sender'] == "{{request.user}}" ) {
                        messageDiv.classList.add("sent")
                    } else {
                        messageDiv.classList.add("received")
                    }
                    messageDivContent.innerHTML = `
                        <p class="username">${elem['sender']}</p>
                        <p class="text">${elem['content']}</p>
                        <p class="timestamp">${elem['timestamp']}</p>
                    `;
                    messageDiv.append(messageDivContent)
                    messageBox.append(messageDiv)
                })


            } else {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add("message")
                const messageDivContent = document.createElement('div');
                messageDivContent.classList.add('.message-content')
                

                if(data['sender'] == "{{request.user}}" ) {
                    messageDiv.classList.add("sent")
                } else {
                    messageDiv.classList.add("received")
                }
                messageDivContent.innerHTML = `
                    <p class="username">${data['sender']}</p>
                    <p class="text">${data['message']}</p>
                    <p class="timestamp">${data['timestamp']}</p>
                `;
                messageDiv.append(messageDivContent)
                messageBox.append(messageDiv)
                console.log(data)
            }
          }

        document.querySelector('.chat-form').addEventListener("submit", (e) => {
            e.preventDefault()
            const messageInputDom = document.querySelector('.message-input');
            const message = messageInputDom.value;
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        });


        document.querySelector('.message-input').focus();
    </script>
</body>
</html>
