{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Chat Room</title>
    <link rel="icon" href="/static/images/icons8-image-48.png">
</head>
<style>
    video#remoteVideoHtml {
        border: 1px solid #2196F3;
        width: 100%;
        width: 318px;

    }

    video#screenShareVideo {
        border: 1px solid #2196F3;
        width: 100%;
        width: 318px;

    } 
    
    video#localVideoHtml {
        border: 1px solid red;
        width: 100%;
        width: 318px;

    }
    .videos {
        border: 1px solid;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        flex-wrap: wrap;
        gap: 14px;
}

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        video#screenShareLocalVideo {
            border: 1px solid #2196F3;
            width: 318px;
            position: relative;
        }
        video#screenShareRemoteVideo {
            border: 1px solid red;
            width: 100%;
            width: 318px;
        }
    
</style>
<body>
    <!-- Video elements for local and remote streams -->
     <div class="videos">
         <video id="localVideoHtml" autoplay playsinline muted></video>
         <video id="remoteVideoHtml" autoplay playsinline muted></video>
         <div class="screen-div">
             <video id="screenShareRemoteVideo" autoplay playsinline muted></video>
         </div>
        
        <video id="screenShareLocalVideo" autoplay playsinline muted></video>
    </div>
        <div class="container">
            <button id="startCallButton">Start Camera Call</button>
            {% comment %} <button id="startAudioButton">Start Audio Call</button> {% endcomment %}
            <button  id="toggleMicButton">Mute Mic</button>
            <button  id="toggleVideoButton">Turn Off Video</button>
            <button id="shareScreenButton">Share Screen</button>
           <button id="stopScreenShareButton">Stop Screen Share</button>
       <button  id="endCallButton">End Call</button>
     </div>
    


    {{ receiverID|json_script:"receiverID" }}

    
    <script>
        const currentCallingUser = "{{request.user.username}}"
        const currentReceivingUser = "{{user.username}}"

    </script>
    <script src="{% static "/js/recordV2.js" %}">
    </script>

</body>
</html>
