{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .chat-container {
      width: 70%;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    .chat-box {
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .message {
      display: flex;
      align-items: flex-end;
      margin: 10px 0;
    }

    .sent {
      justify-content: flex-end;
      text-align: right;
    }

    .received {
      justify-content: flex-start;
      text-align: left;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 10px;
    }

    .message-content {
      max-width: 60%;
      padding: 10px;
      border-radius: 10px;
    }

    .sent .message-content {
      background: #d1e7dd;
      color: black;
    }

    .received .message-content {
      background: #f8d7da;
      color: black;
    }

    .username {
      font-weight: bold;
      font-size: 12px;
    }

    .text {
      font-size: 14px;
    }

    .timestamp {
      font-size: 10px;
      color: gray;
      margin-top: 5px;
    }

    .chat-form {
      display: flex;
      margin-top: 10px;
    }

    .message-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-right: 10px;
    }

    .send-btn {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #0056b3;
    }
    .field {
      display: flex;
      justify-content: center;
      align-content: center;
    }
    input#file_label {
      display: none;
    }
    .timer {
      display: block;
      margin: 0 10px;
    }
  </style>
  <body>
    <div class="chat-container">
      <h2>Chat with {{ receiver.username }}</h2>
      <hr />
      <h2>You: {{ request.user.username }}</h2>

      <div class="chat-box"></div>

      <form method="post" class="chat-form" enctype="multipart/form-data">
        {% csrf_token %}
        <input
          type="text"
          class="message-input"
          placeholder="Type a message..."
          name=""
          id=""
        />
        <div class="field">
          <img src={% static "images/icons8-image-48.png" %} alt=""> <input
          type="file" id="file_label" name="image_file" accept="image/*"
        </div>
        <div style="display: flex" class="field">
          <button id="record">Record</button>
          <button id="stop" disabled>Stop</button>
          {% comment %} <audio id="audioPlayback" controls></audio> {% endcomment %}
        </div>
        <p
        class="timer"
        > <span id="timer">0</span> s</p>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
    <script>
      const chatSocket = new WebSocket(
        "ws://" +
          window.location.host +
          "/ws/messaging/" +
          "{{receiver.id}}" +
          "/"
      );

      chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        const messageBox = document.querySelector(".chat-box");
        if (data["type"] == "chat.history") {
          console.log('data', data)
          data.messages.forEach((elem) => {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            const messageDivContent = document.createElement("div");
            messageDivContent.classList.add(".message-content");

            const senderP = document.createElement("p");
            senderP.classList.add("username");
            senderP.innerHTML = `<p class="username">${elem["sender"]}</p>`;
            messageDivContent.append(senderP);

            if (elem["audio"]) {
              const audioElement = document.createElement("audio");
              audioElement.controls = true;
              audioElement.src = elem["audio"];

              messageDivContent.append(audioElement);
            }

            if (elem["content"]) {
              const textP = document.createElement("p");
              textP.classList.add("text");
              textP.innerHTML = `<p class="username">${elem["content"]}</p>`;
              messageDivContent.append(textP);
            }

            if (elem["messageURL"]) {
              const messageURL = document.createElement("img");
              messageURL.src = elem["messageURL"];
              messageURL.width = 300;
              messageDivContent.append(messageURL);
            }

            if (elem["sender"] == "{{request.user}}") {
              messageDiv.classList.add("sent");
            } else {
              messageDiv.classList.add("received");
            }

            messageDiv.append(messageDivContent);
            messageBox.append(messageDiv);
          });
        } else {

          const messageDiv = document.createElement("div");
          messageDiv.classList.add("message");
          const messageDivContent = document.createElement("div");
          messageDivContent.classList.add(".message-content");


          const senderP = document.createElement("p");
          senderP.classList.add("username");
          senderP.innerHTML = `${data["sender"]}`;
          messageDivContent.append(senderP);


          if (data["audio"]) {
            const audioElement = document.createElement("audio");
            audioElement.controls = true;
            audioElement.src = data["audio"];

            messageDivContent.append(audioElement);
          }
          if (data["message"]) {
            const textP = document.createElement("p");
            textP.classList.add("text");
            textP.innerHTML = `${data["message"]}`;
            messageDivContent.append(textP);
          }

          if (data["messageURL"]) {
            const messageURL = document.createElement("img");
            messageURL.src = data["messageURL"];
            messageURL.width = 300;
            messageDivContent.append(messageURL);
          }


          if (data["sender"] == "{{request.user}}") {
            messageDiv.classList.add("sent");
          } else {
            messageDiv.classList.add("received");
          }

          messageDiv.append(messageDivContent);
          messageBox.append(messageDiv);
        }
      };

      let mediaRecorder;
      let audioBlob;
      let audioChunks = [];
      let startTime, timerInterval;

      function updateTimer() {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = elapsedTime;
    }

      navigator.mediaDevices
        .getUserMedia({ audio: true })
        .then((stream) => {
          mediaRecorder = new MediaRecorder(stream);

          mediaRecorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          });

          mediaRecorder.addEventListener("stop", () => {
            audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioUrl = URL.createObjectURL(audioBlob);

            {% comment %} document.querySelector("#audioPlayback").src = audioUrl; {% endcomment %}
            document.querySelector(".send-btn").click();
            audioChunks = [];
          });

          document.getElementById("record").addEventListener("click", () => {
            mediaRecorder.start();
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById("record").disabled = true;
            document.getElementById("stop").disabled = false;
          });

          document.getElementById("stop").addEventListener("click", () => {
            mediaRecorder.stop();
            clearInterval(timerInterval);
            document.getElementById("record").disabled = false;
            document.getElementById("stop").disabled = true;
          });
        })
        .catch((error) => {
          console.error("Error accessing microphone:", error);
        });
      document.querySelector(".chat-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const messageInputDom = document.querySelector(".message-input");
        const message = messageInputDom.value;

        if (audioBlob) {
          formData.append("audio_file", audioBlob, "voice_message.webm");
        }

        const filesData = [...formData];
        let imageFile;
        let audioFile;
        for (let index = 0; index < filesData.length; index++) {
          const fileData = filesData[index][0];
          if (filesData[index][0].toLowerCase() === "image_file") {
            imageFile = filesData[index][1];
          }

          if (filesData[index][0].toLowerCase() === "audio_file") {
            audioFile = filesData[index][1];
          }
        }

        const formDataFileList = [imageFile.size, audioFile, message];

        const isValidForm = formDataFileList.some((e) => e);

        if (!isValidForm) {
          console.log("form can not be an empty");
        } else {
          if (audioFile) {
            const reader = new FileReader();
            reader.readAsDataURL(audioFile);
            reader.onload = () => {
              const fileAudioContent = {
                name: audioFile.name,
                content: reader.result,
              };
              chatSocket.send(
                JSON.stringify({
                  fileAudioContent: fileAudioContent,
                })
              );
            };
          } else if (imageFile.size) {
            const reader = new FileReader();

            reader.readAsDataURL(imageFile);
            reader.onload = () => {
              const fileImgContent = {
                name: imageFile.name,
                content: reader.result,
              };
              chatSocket.send(
                JSON.stringify({
                  fileImgContent: fileImgContent,
                })
              );
            };
          } else {
            chatSocket.send(
              JSON.stringify({
                text: message,
              })
            );
          }
        }

        document.querySelector(".chat-form").reset()
      });

      document.querySelector(".field img").onclick = () =>
      document.querySelector("input#file_label").click();

      document.querySelector(".message-input").focus();
    </script>
  </body>
</html>
