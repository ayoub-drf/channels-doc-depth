{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .chat-container {
      width: 50%;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }

    .chat-box {
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .message {
      display: flex;
      align-items: flex-end;
      margin: 10px 0;
    }

    .sent {
      justify-content: flex-end;
      text-align: right;
    }

    .received {
      justify-content: flex-start;
      text-align: left;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 10px;
    }

    .message-content {
      max-width: 60%;
      padding: 10px;
      border-radius: 10px;
    }

    .sent .message-content {
      background: #d1e7dd;
      color: black;
    }

    .received .message-content {
      background: #f8d7da;
      color: black;
    }

    .username {
      font-weight: bold;
      font-size: 12px;
    }

    .text {
      font-size: 14px;
    }

    .timestamp {
      font-size: 10px;
      color: gray;
      margin-top: 5px;
    }

    .chat-form {
      display: flex;
      margin-top: 10px;
    }

    .message-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-right: 10px;
    }

    .send-btn {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #0056b3;
    }
    .field {
      display: flex;
      justify-content: center;
      align-content: center;
    }
    input#file_label {
      display: none;
    }
  </style>
  <body>
    <div class="chat-container">
      <h2>Chat with {{ receiver.username }}</h2>
      <hr />
      <h2>You: {{ request.user.username }}</h2>

      <div class="chat-box"></div>

      <form method="post" class="chat-form" enctype="multipart/form-data">
        {% csrf_token %}
        <input
          type="text"
          class="message-input"
          placeholder="Type a message..."
          name=""
          required
          id=""
        />
        <div class="field">
          <img src={% static "images/icons8-image-48.png" %} alt=""> <input
          type="file" id="file_label" name="file" accept="image/*"
        </div>
        <button id="record">Record</button>
        <button id="stop" disabled>Stop</button>
        <audio id="audioPlayback" controls></audio>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
    <script>
        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/messaging/'
            + "{{receiver.id}}"
            + '/'
        );
        let mediaRecorder;
        let audioChunks = []

        {% comment %} const audioStream = navigator.mediaDevices.getUserMedia({ audio: true }) {% endcomment %}
      .then(stream => {
        mediaRecorder = new MediaRecorder(stream);

        // Event fired when data is available
        mediaRecorder.addEventListener("dataavailable", event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        });

        // When recording stops, create an audio blob and display/play it
        mediaRecorder.addEventListener("stop", () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          const audioUrl = URL.createObjectURL(audioBlob);
          document.getElementById("audioPlayback").src = audioUrl;
          audioChunks = [];

          // Optionally, send the audio blob to your server
          sendAudioToServer(audioBlob);
        });

        document.getElementById("record").addEventListener("click", () => {
          mediaRecorder.start();
          document.getElementById("record").disabled = true;
          document.getElementById("stop").disabled = false;
        });

        document.getElementById("stop").addEventListener("click", () => {
          mediaRecorder.stop();
          document.getElementById("record").disabled = false;
          document.getElementById("stop").disabled = true;
        });
      })
      .catch(error => {
        console.error("Error accessing microphone:", error);
      });

      function sendAudioToServer(audioBlob) {
        // Convert Blob to FormData for a POST request
        const formData = new FormData();
        formData.append("audio_file", audioBlob, "voice_message.webm");
        console.log(audioBlob)
        console.log(formData)

        {% comment %} // You can use fetch() to send the file over HTTP:
        fetch("/upload-audio/", {
          method: "POST",
          body: formData,
        })
        .then(response => response.json())
        .then(data => {
          console.log("Audio message uploaded", data);
          // Optionally notify via WebSocket that a new voice message is available.
        })
        .catch(err => console.error("Error uploading audio", err)); {% endcomment %}
      }

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data)
            const messageBox = document.querySelector('.chat-box');
            if (data['type'] == "chat.history") {
                data.messages.forEach((elem) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.classList.add("message")
                    const messageDivContent = document.createElement('div');
                    messageDivContent.classList.add('.message-content')


                    if(elem['sender'] == "{{request.user}}" ) {
                        messageDiv.classList.add("sent")
                    } else {
                        messageDiv.classList.add("received")
                    }
                    console.log(elem['messageURL'])
                    messageDivContent.innerHTML = `
                        <p class="username">${elem['sender']}</p>
                        <p class="text">${elem['content']}</p>
                        <p class="timestamp">${elem['timestamp']}</p>
                        <p class="messageURL">
                        <img width="300" src="${elem['messageURL']}" alt="">
                        </p>
                    `;
                    messageDiv.append(messageDivContent)
                    messageBox.append(messageDiv)
                })


            } else {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add("message")
                const messageDivContent = document.createElement('div');
                messageDivContent.classList.add('.message-content')


                if(data['sender'] == "{{request.user}}" ) {
                    messageDiv.classList.add("sent")
                } else {
                    messageDiv.classList.add("received")
                }
                messageDivContent.innerHTML = `
                    <p class="username">${data['sender']}</p>
                    <p class="text">${data['message']}</p>
                    <p class="timestamp">${data['timestamp']}</p>
                    <p class="messageURL">
                        <img width="300" src="${data['messageURL']}" alt="">
                    </p>
                `;
                messageDiv.append(messageDivContent)
                messageBox.append(messageDiv)
            }
          }

        document.querySelector('.chat-form').addEventListener("submit", (e) => {
            e.preventDefault()
            const form = e.target;
            const formData = new FormData(form);
            const file = e.target.file.files;
            const messageInputDom = document.querySelector('.message-input');
            const message = messageInputDom.value;

            if(e.target.file.files.length < 1) {
                chatSocket.send(JSON.stringify({
                    'message': message,
                }));
            } else {

                {% comment %} console.log(file[0].name) {% endcomment %}
                const reader = new FileReader();
                reader.readAsDataURL(file[0]);
                reader.onload = () => {
                  console.log(reader.result)
                  const fileImgContent = {
                      name: file[0].name,
                      content: reader.result,
                  }

                  chatSocket.send(JSON.stringify({
                      'message': message,
                      'fileImgContent': fileImgContent
                  }));
                }

                {% comment %} const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const fileImgContent = {
                        filename: file.name,
                        content: reader.result,
                    }

                    chatSocket.send(JSON.stringify({
                        'message': message,
                        'fileImgContent': fileImgContent
                    }));
                } {% endcomment %}
            }

        });

        document.querySelector('.field img').onclick = () => document.querySelector('input#file_label').click();


        document.querySelector('.message-input').focus();
    </script>
  </body>
</html>
